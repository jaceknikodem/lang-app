[project]
name = "stanza-lemmatization-service"
version = "1.0.0"
description = "FastAPI service wrapping Stanza for lemmatization"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.0",
    "stanza==1.7.0",
    "wordfreq==3.0.3",
    "setuptools",
    "misaki==0.7.4",
    "fugashi",
    "unidic-lite",
    "jaconv",
    "mojimoji",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.14.0",
]

[project.scripts]
stanza-service = "stanza_service:main"

